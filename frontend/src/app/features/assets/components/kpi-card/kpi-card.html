<div class="kpi-card">
    <span class="kpi-label">{{ label() }}</span>
    <span class="kpi-value" [class.emerald]="variant() === 'emerald'">
        {{ value() }} 
        <small>
            @if (unit()) {
                {{ unit() }}
            }
        </small>
    </span>
    @if (subtext()) {
        <span class="kpi-subtext">{{ subtext() }}</span>
    }
</div>
