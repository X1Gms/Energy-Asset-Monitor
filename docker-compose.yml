services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_asset_db
    restart: always
    environment:
      POSTGRES_USER: energy_asset_user
      POSTGRES_PASSWORD: energy_asset_password
      POSTGRES_DB: energy_asset_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: